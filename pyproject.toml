[project]
name = "tpu-cake"
version = "0.1.0"
description = "Verified TPU schedule search built on xDSL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax==0.11.0",
    "ml-dtypes>=0.6.0",
    "numpy>=2.2,<3",
    "pydantic>=2.12,<3",
    "xdsl>=0.69,<0.70",
    "xprof>=2.23,<3",
]

[project.scripts]
tpu-cake = "tpu_cake.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpu_cake"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
